[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodon-defense"
dynamic = ["version"]
description = "A local-first, observe-only-by-default Linux network defense MVP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
capture = ["scapy>=2.5,<3"]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5"]
geo = ["maxminddb>=2,<4"]

[project.scripts]
megalodon = "megalodon.cli:main"
megalodon-evaluate = "megalodon.evaluation:main"
megalodon-local-manage = "megalodon.local_install:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["megalodon*"]

[tool.setuptools.dynamic]
version = {attr = "megalodon.__version__"}

[tool.setuptools.package-data]
"megalodon.assets" = ["*.svg"]
"megalodon.reference" = [
  "iana-v1/*.json",
  "iana-v1/*.jsonl",
  "corpus-v1/*.json",
  "corpus-v1/*.jsonl",
]
