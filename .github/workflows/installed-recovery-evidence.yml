name: Ubuntu installed wheel recovery evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  installed-recovery-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.retain.outputs.artifact-id }}
      packet-sha256: ${{ steps.evidence.outputs.packet-sha256 }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pin clean non-root source and create disposable environments
        id: source
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo "tree=$(git rev-parse --verify 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          unset PYTHONPATH PYTHONHOME
          python -I -m venv "$RUNNER_TEMP/recovery-build"
          python -I -m venv "$RUNNER_TEMP/recovery-installed"
          mkdir -m 700 "$RUNNER_TEMP/recovery-wheels" "$RUNNER_TEMP/recovery-run" "$RUNNER_TEMP/recovery-receipts"
      - name: Build ephemeral wheel with hash-locked build tools
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/recovery-build/bin/python" -I -m pip install \
            --require-hashes --only-binary=:all: --no-cache-dir \
            -r constraints/build-linux-cp312.txt
          "$RUNNER_TEMP/recovery-build/bin/python" -I -m pip check
          PIP_NO_INDEX=1 "$RUNNER_TEMP/recovery-build/bin/python" -I -m build \
            --no-isolation --wheel --outdir "$RUNNER_TEMP/recovery-wheels"
      - name: Install local wheel offline and rehearse outside checkout
        id: evidence
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONNOUSERSITE=1
          wheels=("$RUNNER_TEMP"/recovery-wheels/megalodon_defense-*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/recovery-installed/bin/python" -I -m pip install \
            --no-index --no-deps --no-cache-dir "${wheels[0]}"
          "$RUNNER_TEMP/recovery-installed/bin/python" -I -m pip check
          cd "$RUNNER_TEMP/recovery-run"
          receipt="$RUNNER_TEMP/recovery-receipts/installed-wheel-recovery.json"
          "$RUNNER_TEMP/recovery-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/tools/installed_recovery_evidence.py" \
            --expected-commit "$EXPECTED_COMMIT" --expected-tree "$EXPECTED_TREE" collect \
            --checkout "$GITHUB_WORKSPACE" --wheel "${wheels[0]}" \
            --build-python "$RUNNER_TEMP/recovery-build/bin/python" > "$receipt"
          "$RUNNER_TEMP/recovery-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/tools/installed_recovery_evidence.py" \
            --expected-commit "$EXPECTED_COMMIT" --expected-tree "$EXPECTED_TREE" verify "$receipt"
          echo "packet-sha256=$(sha256sum "$receipt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain only the verified synthetic receipt
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-recovery-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-receipts/installed-wheel-recovery.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false

  installed-recovery-roundtrip:
    needs: installed-recovery-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exact retained artifact ID
        env:
          ARTIFACT_ID: ${{ needs.installed-recovery-evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Download only the retained recovery artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.installed-recovery-evidence.outputs.artifact-id }}
          path: ${{ runner.temp }}/recovery-roundtrip
          merge-multiple: true
          digest-mismatch: error
      - name: Verify downloaded bytes and every phase binding
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PACKET_SHA256: ${{ needs.installed-recovery-evidence.outputs.packet-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          export EXPECTED_TREE="$(git rev-parse --verify 'HEAD^{tree}')"
          python - <<'PYROUNDTRIP'
          import hashlib
          import os
          from pathlib import Path
          import re

          directory = Path(os.environ["RUNNER_TEMP"]) / "recovery-roundtrip"
          packet = directory / "installed-wheel-recovery.json"
          if (set(directory.iterdir()) != {packet} or packet.is_symlink()
                  or not packet.is_file() or packet.stat().st_size > 16384):
              raise SystemExit("RECOVERY_ROUNDTRIP:FILE_SET")
          expected = os.environ["EXPECTED_PACKET_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", expected) is None:
              raise SystemExit("RECOVERY_ROUNDTRIP:DIGEST_FORMAT")
          if hashlib.sha256(packet.read_bytes()).hexdigest() != expected:
              raise SystemExit("RECOVERY_ROUNDTRIP:BYTES_MISMATCH")
          PYROUNDTRIP
          python tools/installed_recovery_evidence.py \
            --expected-commit "$EXPECTED_COMMIT" --expected-tree "$EXPECTED_TREE" \
            verify "$RUNNER_TEMP/recovery-roundtrip/installed-wheel-recovery.json"
