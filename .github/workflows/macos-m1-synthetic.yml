name: macOS M1 synthetic sample

on:
  pull_request:

permissions:
  contents: read

jobs:
  macos-m1-sample:
    # Temporary compatibility experiment; removed after native readback.
    strategy:
      fail-fast: false
      matrix:
        include:
          - subject: current-main
            sha: 0acdf72663804c9ae8380522e344a515ac65978c
          - subject: pr-660
            sha: c2e1d50f6a8017bc5e5938edf01016ba7dc19ff0
          - subject: pr-661
            sha: 8983094f1411ed97f828046f4fed4995917fb208
    name: macos-m1-sample (${{ matrix.subject }})
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Inventory exact candidate and excluded M1 gates
        env:
          EXPECTED_COMMIT: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT"
          observed_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          test "$(uname -s)" = Darwin
          {
            echo '## Hosted macOS M1 sample receipt'
            echo
            echo "PR head: \`$EXPECTED_COMMIT\`; tree: \`$observed_tree\`."
            echo "Runner image: \`${ImageOS:-not_recorded}\` / \`${ImageVersion:-not_recorded}\`."
            echo "macOS: \`$(sw_vers -productVersion)\` build \`$(sw_vers -buildVersion)\`; architecture: \`$(uname -m)\`; \`$(python -VV)\`."
            echo
            echo 'Selected: core package only; built-in sample (13 events under cap 14) and demo-threat sample (114 events under cap 115).'
            echo 'Not run: JSONL replay, dashboard listener/browser, Intel plus Apple Silicon pair, offline adapters, capture, firewall backend, and operator privacy review.'
            echo 'This hosted smoke result is one recorded runner environment, not M1 platform acceptance or a catalog promotion.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install core package
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m pip check
          python -m pip show megalodon-defense
      - name: Reproduce original writer ancestry failure on pinned subject
        run: |
          python - <<'PYCODE'
          import stat
          import tempfile
          from pathlib import Path
          from megalodon.config import Settings
          from megalodon.evidence_storage import EvidenceStorage
          from megalodon.local_install import InstallError
          if not stat.S_ISLNK(Path('/var').lstat().st_mode):
              raise SystemExit('BASELINE_WRITER:VAR_NOT_SYMLINK')
          with tempfile.TemporaryDirectory(prefix='megalodon-original-writer-') as root:
              home = Path(root) / 'home'
              home.mkdir(mode=0o700)
              try:
                  manager = EvidenceStorage(Settings(db_path=home / 'old.db'), home=home)
              except InstallError as exc:
                  if str(exc) != 'installation directory ancestry is unsafe: /var':
                      raise SystemExit('BASELINE_WRITER:UNEXPECTED_REFUSAL') from exc
                  print('BASELINE_WRITER:VAR_SYMLINK_REFUSED_BEFORE_WRITE')
              else:
                  manager.close()
                  raise SystemExit('BASELINE_WRITER:UNEXPECTED_ACCEPT')
              if (home / '.local').exists():
                  raise SystemExit('BASELINE_WRITER:UNEXPECTED_WRITE')
          PYCODE
      - name: Apply exact candidate reader-anchor delta to pinned source
        run: |
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          p = Path('megalodon/evidence_storage.py')
          before = p.read_bytes()
          blob = lambda b: hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(before) == '2be40c8f8a4c92c222a84e0b6d90d98a41e1a262'
          old = b"                                  else (_anchored_database_path(descriptor,path,'EVIDENCE'),None))"
          new = b"                                  else (_anchored_database_path(descriptor,path,'EVIDENCE'),None))\n            # Darwin read-only SQLite may report this exact verified /dev/fd anchor.\n            if not write:anchor=sqlite_path"
          assert before.count(old) == 1
          after = before.replace(old, new)
          p.write_bytes(after)
          print('COMPATIBILITY_READER_DELTA:', blob(before), '->', blob(after))
          PYCODE
      - name: Run native storage safety negatives
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile

          from megalodon.storage import (
              PRIVATE_DATABASE_MODE,
              StorageSchemaError,
              Store,
              _open_private_database,
              _open_private_directory,
              _writable_sqlite_connection_path,
          )

          if sys.platform != "darwin":
              raise SystemExit("MACOS_STORAGE_NEGATIVES:UNEXPECTED_PLATFORM")

          results = []

          def expect(label, expected, action):
              try:
                  action()
              except StorageSchemaError as exc:
                  actual = str(exc)
                  if actual != expected:
                      raise SystemExit(
                          f"MACOS_STORAGE_NEGATIVES:{label}:UNEXPECTED_CODE"
                      ) from exc
                  results.append({"case": label, "status": "refused", "code": actual})
              else:
                  raise SystemExit(
                      f"MACOS_STORAGE_NEGATIVES:{label}:UNEXPECTED_ACCEPT"
                  )

          with tempfile.TemporaryDirectory(prefix="megalodon-m1-negative-") as root:
              private = Path(root) / "private"
              private.mkdir(mode=0o700)
              database = private / "audit.db"

              with Store(database):
                  pass

              alias = private / "alias.db"
              alias.symlink_to(database)
              expect(
                  "database-symlink",
                  "STORAGE_PATH:SYMLINK_REFUSED",
                  lambda: Store(alias, create=False),
              )
              alias.unlink()

              target = private / "sidecar-target"
              target.write_bytes(b"target")
              target.chmod(PRIVATE_DATABASE_MODE)
              sidecar = private / "audit.db-wal"
              sidecar.symlink_to(target)
              expect(
                  "sidecar-symlink",
                  "STORAGE_PATH:SYMLINK_REFUSED",
                  lambda: Store(database, create=False),
              )
              sidecar.unlink()

              for suffix in ("-journal", "-wal", "-shm"):
                  target = private / f"hardlink-target{suffix}"
                  target.write_bytes(b"hardlink-sentinel")
                  target.chmod(PRIVATE_DATABASE_MODE)
                  sidecar = private / f"audit.db{suffix}"
                  os.link(target, sidecar)
                  try:
                      expect(
                          f"sidecar-hardlink{suffix}",
                          "STORAGE_PATH:UNSAFE_DATABASE",
                          lambda: Store(database, create=False),
                      )
                      if target.read_bytes() != b"hardlink-sentinel":
                          raise SystemExit("MACOS_STORAGE_NEGATIVES:SIDECAR_MUTATED")
                  finally:
                      sidecar.unlink()
                      target.unlink()

              sidecar = private / "audit.db-wal"
              sidecar.mkdir()
              try:
                  expect(
                      "sidecar-directory",
                      "STORAGE_PATH:UNSAFE_SIDECAR",
                      lambda: Store(database, create=False),
                  )
              finally:
                  sidecar.rmdir()

              directory_fd = _open_private_directory(
                  private, create=False, prefix="STORAGE_PATH"
              )
              database_fd = None
              moved = private / "preconnect-original.db"
              replacement = b"preconnect-replacement-sentinel"
              try:
                  database_fd, _ = _open_private_database(
                      database, directory_fd, writable=True, create=False,
                      prefix="STORAGE_PATH",
                  )
                  database.rename(moved)
                  database.write_bytes(replacement)
                  database.chmod(PRIVATE_DATABASE_MODE)
                  expect(
                      "preconnect-replacement",
                      "STORAGE_PATH:DATABASE_CHANGED",
                      lambda: _writable_sqlite_connection_path(
                          database_fd, database, "STORAGE_PATH"
                      ),
                  )
                  if database.read_bytes() != replacement:
                      raise SystemExit("MACOS_STORAGE_NEGATIVES:REPLACEMENT_MUTATED")
              finally:
                  if database_fd is not None:
                      os.close(database_fd)
                  os.close(directory_fd)
                  if database.exists():
                      database.unlink()
                  if moved.exists():
                      moved.rename(database)

              store = Store(database, create=False)
              moved = private / "original.db"
              replacement = b"replacement-sentinel"
              try:
                  database.rename(moved)
                  database.write_bytes(replacement)
                  database.chmod(PRIVATE_DATABASE_MODE)
                  expect(
                      "runtime-replacement",
                      "STORAGE_PATH:DATABASE_CHANGED",
                      lambda: store.start_ingestion_run("sample"),
                  )
                  if database.read_bytes() != replacement:
                      raise SystemExit(
                          "MACOS_STORAGE_NEGATIVES:REPLACEMENT_MUTATED"
                      )
              finally:
                  if database.exists():
                      database.unlink()
                  if moved.exists():
                      moved.rename(database)
                  store.close()

              # Swap an ancestor only while SQLite resolves the admitted
              # pathname, then restore it, so every pathname check passes.
              import megalodon.storage as storage_module

              swap = Path(root) / "swap"
              admitted_root = swap / "admitted"
              other_root = swap / "other"
              held_root = swap / "held"
              for tree in (admitted_root, other_root):
                  (tree / "private").mkdir(parents=True, mode=0o700)
              swapped = admitted_root / "private" / "audit.db"
              other = other_root / "private" / "audit.db"
              real_connect = storage_module.sqlite3.connect

              def swapping_connect(*args, **kwargs):
                  admitted_root.rename(held_root)
                  other_root.rename(admitted_root)
                  try:
                      return real_connect(*args, **kwargs)
                  finally:
                      admitted_root.rename(other_root)
                      held_root.rename(admitted_root)

              def swapped_open():
                  storage_module.sqlite3.connect = swapping_connect
                  try:
                      Store(swapped, create=False)
                  finally:
                      storage_module.sqlite3.connect = real_connect

              with Store(swapped):
                  pass
              with Store(other):
                  pass
              other_bytes = other.read_bytes()
              expect(
                  "connect-ancestor-swap",
                  "STORAGE_PATH:DATABASE_CHANGED",
                  swapped_open,
              )
              if other.read_bytes() != other_bytes:
                  raise SystemExit("MACOS_STORAGE_NEGATIVES:SWAP_TARGET_MUTATED")

              # Open connections make SQLite defer closing, then reuse, the
              # swapped-in file's descriptor, so no new descriptor appears.
              holders = [Store(swapped, create=False), Store(other, create=False)]
              try:
                  Store(other, create=False).close()
                  other_bytes = other.read_bytes()
                  expect(
                      "connect-ancestor-swap-reused-descriptor",
                      "STORAGE_PATH:DATABASE_CHANGED",
                      swapped_open,
                  )
                  if other.read_bytes() != other_bytes:
                      raise SystemExit(
                          "MACOS_STORAGE_NEGATIVES:SWAP_TARGET_MUTATED"
                      )
              finally:
                  for holder in holders:
                      holder.close()
              with Store(swapped, create=False) as store:
                  if store.summary()["events"] != 0:
                      raise SystemExit("MACOS_STORAGE_NEGATIVES:SWAP_ADMITTED_CHANGED")

              # Swap before the verifier's ancestor baseline, so both ancestor
              # samples see the same swapped tree; restore after the second.
              real_generations = storage_module._ancestor_generations
              baseline = Path(root) / "baseline"
              admitted_root = baseline / "admitted"
              other_root = baseline / "other"
              held_root = baseline / "held"
              for tree in (admitted_root, other_root):
                  (tree / "private").mkdir(parents=True, mode=0o700)
              admitted = admitted_root / "private" / "audit.db"
              other = other_root / "private" / "audit.db"
              holders = [Store(admitted), Store(other)]
              try:
                  Store(other, create=False).close()
                  other_bytes = other.read_bytes()
                  calls = []

                  def swapping_generations(directory):
                      calls.append(directory)
                      if len(calls) == 1:
                          admitted_root.rename(held_root)
                          other_root.rename(admitted_root)
                      generations = real_generations(directory)
                      if len(calls) == 2:
                          admitted_root.rename(other_root)
                          held_root.rename(admitted_root)
                      return generations

                  def baseline_swapped_open():
                      storage_module._ancestor_generations = swapping_generations
                      try:
                          Store(admitted, create=False)
                      finally:
                          storage_module._ancestor_generations = real_generations
                          if held_root.exists():
                              admitted_root.rename(other_root)
                              held_root.rename(admitted_root)

                  expect(
                      "baseline-ancestor-swap",
                      "STORAGE_PATH:DATABASE_CHANGED",
                      baseline_swapped_open,
                  )
                  if other.read_bytes() != other_bytes:
                      raise SystemExit("MACOS_STORAGE_NEGATIVES:SWAP_TARGET_MUTATED")
              finally:
                  for holder in holders:
                      holder.close()

              # Before the baseline, swap in a parent whose audit.db is a
              # temporary hard link to the admitted inode, so a pathname
              # identity check alone passes; the parent must also match.
              hardlink = Path(root) / "hardlink"
              admitted_root = hardlink / "admitted"
              swapped_root = hardlink / "swapped"
              held_root = hardlink / "held"
              alternate_root = hardlink / "alternate"
              for tree in (admitted_root, swapped_root, alternate_root):
                  (tree / "private").mkdir(parents=True, mode=0o700)
              admitted = admitted_root / "private" / "audit.db"
              alternate = alternate_root / "private" / "audit.db"
              link = swapped_root / "private" / "audit.db"
              holders = [Store(admitted), Store(alternate)]
              try:
                  Store(alternate, create=False).close()
                  admitted_bytes = admitted.read_bytes()
                  alternate_bytes = alternate.read_bytes()
                  calls = []

                  def linking_generations(directory):
                      calls.append(directory)
                      if len(calls) == 1:
                          os.link(admitted, link)
                          admitted_root.rename(held_root)
                          swapped_root.rename(admitted_root)
                      return real_generations(directory)

                  def hardlink_swapped_open():
                      storage_module._ancestor_generations = linking_generations
                      try:
                          Store(admitted, create=False)
                      finally:
                          storage_module._ancestor_generations = real_generations
                          if held_root.exists():
                              admitted_root.rename(swapped_root)
                              held_root.rename(admitted_root)

                  expect(
                      "baseline-parent-hardlink",
                      "STORAGE_PATH:DATABASE_CHANGED",
                      hardlink_swapped_open,
                  )
                  # The parent re-check refuses right after the first sample.
                  if len(calls) != 1:
                      raise SystemExit("MACOS_STORAGE_NEGATIVES:HARDLINK_NOT_FIRST_SAMPLE")
                  if (
                      admitted.read_bytes() != admitted_bytes
                      or alternate.read_bytes() != alternate_bytes
                  ):
                      raise SystemExit("MACOS_STORAGE_NEGATIVES:HARDLINK_TARGET_MUTATED")
              finally:
                  if link.exists():
                      link.unlink()
                  for holder in holders:
                      holder.close()

          print(json.dumps(results, sort_keys=True))
          if len(results) != 12:
              raise SystemExit("MACOS_STORAGE_NEGATIVES:INCOMPLETE")
          PY
      - name: Check a live Store keeps its own SQLite locks
        run: |
          python - <<'PY'
          # Without O_PATH, closing any descriptor for -shm releases this
          # process's locks on it, including the dead-man switch that tells
          # other processes the WAL index is live. A second process probes
          # SQLite's unix-VFS lock bytes after MEGALODON's own checks ran.
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys
          import tempfile

          import megalodon.storage as storage_module
          from megalodon.models import ActionRecord
          from megalodon.storage import Store

          if sys.platform != "darwin" or storage_module._lock_preserving_open():
              raise SystemExit("MACOS_LOCKS:UNEXPECTED_PLATFORM")

          PROBE = r"""
          import fcntl, os, sys
          def in_use(target, length, start):
              descriptor = os.open(target, os.O_RDWR)
              try:
                  fcntl.lockf(descriptor, fcntl.LOCK_EX | fcntl.LOCK_NB, length, start)
              except OSError:
                  return True
              finally:
                  os.close(descriptor)
              return False
          print(in_use(sys.argv[1] + "-shm", 1, 128), in_use(sys.argv[1], 510, 0x40000002))
          """
          stamp = datetime(2026, 1, 1, tzinfo=timezone.utc)
          results = []

          def held(label, database):
              observed = subprocess.run(
                  [sys.executable, "-c", PROBE, str(database)],
                  capture_output=True, text=True, timeout=30, check=True,
              ).stdout.split()
              results.append({"case": label, "dead_man_switch_and_shared": observed})
              if observed != ["True", "True"]:
                  raise SystemExit(f"MACOS_LOCKS:{label}:RELEASED")

          with tempfile.TemporaryDirectory(prefix="megalodon-m1-locks-") as root:
              private = Path(root) / "private"
              private.mkdir(mode=0o700)
              database = private / "audit.db"
              with Store(database) as store:
                  for _ in range(3):
                      store.record_action(
                          ActionRecord(stamp, "probe", "192.0.2.1", "not_attempted", "x")
                      )
                  held("after-writes", database)
                  store._ensure_capacity()
                  held("after-capacity-check", database)
                  wal = private / "audit.db-wal"
                  wal.chmod(0o644)
                  storage_module._validate_sqlite_sidecars(
                      database, None, writable=True, prefix="STORAGE_PATH"
                  )
                  if stat.S_IMODE(os.stat(wal).st_mode) != 0o600:
                      raise SystemExit("MACOS_LOCKS:SIDECAR_MODE_NOT_NORMALISED")
                  held("after-sidecar-normalisation", database)
                  store.record_action(
                      ActionRecord(stamp, "probe", "192.0.2.1", "not_attempted", "x")
                  )
                  held("after-later-write", database)
                  if store.summary()["actions"] != 4:
                      raise SystemExit("MACOS_LOCKS:UNEXPECTED_COUNT")
                  check = store.connection.execute("PRAGMA integrity_check").fetchone()
                  if check[0] != "ok":
                      raise SystemExit("MACOS_LOCKS:INTEGRITY")

          print(json.dumps(results, sort_keys=True))
          PY
      - name: Write AI receipts and an evidence segment natively
        run: |
          python - <<'PY'
          # Darwin SQLite cannot create a rollback journal through /dev/fd/N
          # (SQLITE_CANTOPEN on the first write). Store already connects by
          # its admitted pathname; the AI receipt store and evidence segment
          # writers must too, and still refuse a symlinked database.
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile

          from megalodon.ai_broker import ReceiptStore
          from megalodon.config import Settings
          from megalodon.evidence_storage import GIB, EvidenceStorage
          from megalodon.local_install import InstallError
          from megalodon.models import PacketEvent
          from megalodon.storage import StorageSchemaError

          if sys.platform != "darwin":
              raise SystemExit("MACOS_WRITERS:UNEXPECTED_PLATFORM")
          results = {}
          with tempfile.TemporaryDirectory(prefix="megalodon-m1-writers-") as root:
              results["temporary_ancestor_symlink"] = any(
                  parent.is_symlink() for parent in Path(root).parents
              )
              # macOS tempfile paths can start at the /var -> /private/var alias.
              # Select the real newly-created fixture; keep production ancestry
              # validation intact, including any symlink introduced below it.
              root = Path(root).resolve(strict=True)
              private = root / "receipts"
              private.mkdir(mode=0o700)
              receipts_path = private / "receipts.db"
              with ReceiptStore(receipts_path) as receipts:
                  for index in range(3):
                      receipts.append(f"receipt-{index}", {"state": "not_attempted"})
                  if receipts.verify_chain()["sequence"] != 3:
                      raise SystemExit("MACOS_WRITERS:RECEIPT_COUNT")
              results["receipt_store"] = "written"
              with ReceiptStore(receipts_path) as receipts:
                  if receipts.verify_chain()["sequence"] != 3:
                      raise SystemExit("MACOS_WRITERS:RECEIPT_REOPEN")
              linked = private / "linked.db"
              linked.symlink_to(receipts_path.name)
              before = receipts_path.read_bytes()
              try:
                  ReceiptStore(linked).close()
              except StorageSchemaError as exc:
                  if str(exc) != "AI_RECEIPT:SYMLINK_REFUSED":
                      raise SystemExit(f"MACOS_WRITERS:RECEIPT_SYMLINK:{exc}")
              else:
                  raise SystemExit("MACOS_WRITERS:RECEIPT_SYMLINK_ACCEPTED")
              if receipts_path.read_bytes() != before:
                  raise SystemExit("MACOS_WRITERS:RECEIPT_SYMLINK_TARGET_CHANGED")
              results["receipt_store_symlink"] = "refused"

              home = root / "home"
              home.mkdir(mode=0o700)
              linked_home = root / "linked-home"
              linked_home.symlink_to(home, target_is_directory=True)
              try:
                  EvidenceStorage(Settings(db_path=home / "old.db"), home=linked_home)
              except InstallError as exc:
                  if "ancestry is unsafe" not in str(exc):
                      raise SystemExit("MACOS_WRITERS:HOME_SYMLINK_UNEXPECTED_REFUSAL") from exc
              else:
                  raise SystemExit("MACOS_WRITERS:HOME_SYMLINK_ACCEPTED")
              if (home / ".local").exists():
                  raise SystemExit("MACOS_WRITERS:HOME_SYMLINK_TARGET_CHANGED")
              results["evidence_home_symlink"] = "refused"
              now = datetime.now(timezone.utc).timestamp()
              manager = EvidenceStorage(
                  Settings(db_path=home / "old.db"), home=home,
                  clock=lambda: now, monotonic=lambda: now, segment_bytes=65536,
              )
              try:
                  preview = manager.preview(
                      dict(profile="home", retention_days=14, cap_bytes=20 * GIB)
                  )
                  manager.apply(preview["preview_id"])
                  writer = manager.packet_writer()
                  run = writer.start_ingestion_run("jsonl")
                  writer.record_event_bundle(
                      PacketEvent(datetime.fromtimestamp(now, timezone.utc),
                                  "10.0.0.2", "1.1.1.1", "TCP", 50000, 443, byte_count=1),
                      [], [], run_id=run,
                  )
                  writer.finish_ingestion_run(run, "source_exhausted")
                  writer.close()
                  entry = manager._catalog["entries"][0]
                  with manager._db(entry) as reader:
                      count = reader.execute("SELECT COUNT(*) FROM events").fetchone()[0]
                  if count != 1:
                      raise SystemExit("MACOS_WRITERS:EVIDENCE_COUNT")
              finally:
                  manager.close()
              results["evidence_segment_writer"] = "written"
          print(json.dumps(results, sort_keys=True))
          PY
      - name: Record bounded storage-admission diagnostic
        run: |
          set -euo pipefail
          python tools/probe_storage_admission.py | tee "$RUNNER_TEMP/storage-admission-diagnostic.json"
          {
            echo
            echo '### Storage admission diagnostic'
            echo
            echo 'Diagnostic collection succeeded. This does not mean storage admission or the sample command succeeded.'
            cat "$RUNNER_TEMP/storage-admission-diagnostic.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run bounded sample commands in a private temporary directory
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          if sys.platform != "darwin" or sys.version_info[:2] != (3, 12):
              raise SystemExit("MACOS_M1:UNEXPECTED_RUNNER")

          cases = (
              ("sample-13", ("--max-events", "14"), 13),
              ("demo-threat-114", ("--demo-threat", "--max-events", "115"), 114),
          )
          results = []
          with tempfile.TemporaryDirectory(prefix="megalodon-m1-") as private_dir:
              for name, options, expected in cases:
                  command = (sys.executable, "-m", "megalodon", "run", "--source", "sample", *options)
                  try:
                      completed = subprocess.run(
                          command, cwd=private_dir, capture_output=True, text=True,
                          timeout=60, check=False,
                      )
                  except subprocess.TimeoutExpired:
                      results.append({"case": name, "status": "timeout"})
                      break
                  if completed.returncode != 0:
                      diagnostic = completed.stderr.strip()
                      if re.fullmatch(r"megalodon: [A-Z_]+(?::[A-Z_]+)?", diagnostic) is None:
                          diagnostic = "unclassified"
                      results.append({
                          "case": name, "status": "failed", "exit_code": completed.returncode,
                          "diagnostic": diagnostic,
                      })
                      break
                  try:
