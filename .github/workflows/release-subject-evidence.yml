name: Ubuntu release subject evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-subjects:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.retain.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
      recovery-artifact-id: ${{ steps.retain-recovery.outputs.artifact-id }}
      recovery-packet-sha256: ${{ steps.recovery.outputs.packet-sha256 }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and bind two temporary distributions
        id: build
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          expected_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          unset PYTHONPATH PYTHONHOME
          python -I -m venv "$RUNNER_TEMP/release-build"
          "$RUNNER_TEMP/release-build/bin/python" -I -m pip install \
            --require-hashes --only-binary=:all: --no-cache-dir \
            -r constraints/build-linux-cp312.txt
          "$RUNNER_TEMP/release-build/bin/python" -I -m pip check
          mkdir -m 700 "$RUNNER_TEMP/release-subjects"
          PIP_NO_INDEX=1 "$RUNNER_TEMP/release-build/bin/python" -I -m build \
            --no-isolation --sdist --wheel --outdir "$RUNNER_TEMP/release-subjects"
          version="$(python -c 'import megalodon; print(megalodon.__version__)')"
          wheel="$RUNNER_TEMP/release-subjects/megalodon_defense-${version}-py3-none-any.whl"
          sdist="$RUNNER_TEMP/release-subjects/megalodon_defense-${version}.tar.gz"
          python -I tools/release_subjects.py collect \
            --github-actions-origin \
            --checkout . --expected-commit "$EXPECTED_COMMIT" \
            --expected-tree "$expected_tree" --package-version "$version" \
            --wheel "$wheel" --sdist "$sdist" \
            > "$RUNNER_TEMP/release-subjects/subjects.json"
          python -I tools/release_subjects.py verify \
            --github-actions-origin \
            --directory "$RUNNER_TEMP/release-subjects" \
            --expected-commit "$EXPECTED_COMMIT" --expected-tree "$expected_tree"
          test -z "$(git status --porcelain --untracked-files=normal)"
          manifest_sha256="$(sha256sum "$RUNNER_TEMP/release-subjects/subjects.json" | cut -d ' ' -f 1)"
          echo "manifest-sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Rehearse recovery with the exact release wheel
        id: recovery
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONNOUSERSITE=1
          expected_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          python -I -m venv "$RUNNER_TEMP/release-recovery-installed"
          mkdir -m 700 "$RUNNER_TEMP/release-recovery-run" "$RUNNER_TEMP/release-recovery-receipts"
          wheels=("$RUNNER_TEMP"/release-subjects/megalodon_defense-*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/release-recovery-installed/bin/python" -I -m pip install \
            --no-index --no-deps --no-cache-dir "${wheels[0]}"
          "$RUNNER_TEMP/release-recovery-installed/bin/python" -I -m pip check
          cd "$RUNNER_TEMP/release-recovery-run"
          receipt="$RUNNER_TEMP/release-recovery-receipts/installed-wheel-recovery.json"
          "$RUNNER_TEMP/release-recovery-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/tools/installed_recovery_evidence.py" \
            --expected-commit "$EXPECTED_COMMIT" --expected-tree "$expected_tree" collect \
            --checkout "$GITHUB_WORKSPACE" --wheel "${wheels[0]}" \
            --build-python "$RUNNER_TEMP/release-build/bin/python" \
            --subjects-directory "$RUNNER_TEMP/release-subjects" > "$receipt"
          "$RUNNER_TEMP/release-recovery-installed/bin/python" -I \
            "$GITHUB_WORKSPACE/tools/installed_recovery_evidence.py" \
            --expected-commit "$EXPECTED_COMMIT" --expected-tree "$expected_tree" \
            verify "$receipt" --subjects-directory "$RUNNER_TEMP/release-subjects"
          echo "packet-sha256=$(sha256sum "$receipt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Retain exact unreviewed subjects
        id: retain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-subjects-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-subjects/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
      - name: Retain recovery evidence for these exact subjects
        id: retain-recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-subject-recovery-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-recovery-receipts/installed-wheel-recovery.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false

  subject-roundtrip:
    needs: build-subjects
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require both exact same-run artifact IDs
        env:
          SUBJECT_ARTIFACT_ID: ${{ needs.build-subjects.outputs.artifact-id }}
          RECOVERY_ARTIFACT_ID: ${{ needs.build-subjects.outputs.recovery-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECOVERY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$SUBJECT_ARTIFACT_ID" != "$RECOVERY_ARTIFACT_ID"
      - name: Download the exact same-run artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-subjects.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-subject-roundtrip
          merge-multiple: true
          digest-mismatch: error
      - name: Download its exact same-run recovery receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-subjects.outputs.recovery-artifact-id }}
          path: ${{ runner.temp }}/release-recovery-roundtrip
          merge-multiple: true
          digest-mismatch: error
      - name: Verify source and retained subject bytes offline
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-subjects.outputs.manifest-sha256 }}
          EXPECTED_PACKET_SHA256: ${{ needs.build-subjects.outputs.recovery-packet-sha256 }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual_manifest_sha256="$(sha256sum "$RUNNER_TEMP/release-subject-roundtrip/subjects.json" | cut -d ' ' -f 1)"
          test "$actual_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          python -I tools/release_subjects.py verify \
            --github-actions-origin \
            --directory "$RUNNER_TEMP/release-subject-roundtrip" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-tree "$(git rev-parse --verify 'HEAD^{tree}')"
          python -I - <<'PYROUNDTRIP'
          import hashlib
          import os
          from pathlib import Path
          import re

          directory = Path(os.environ["RUNNER_TEMP"]) / "release-recovery-roundtrip"
          packet = directory / "installed-wheel-recovery.json"
          if (set(directory.iterdir()) != {packet} or packet.is_symlink()
                  or not packet.is_file() or packet.stat().st_size > 16384):
              raise SystemExit("RECOVERY_ROUNDTRIP:FILE_SET")
          expected = os.environ["EXPECTED_PACKET_SHA256"]
          if re.fullmatch(r"[0-9a-f]{64}", expected) is None:
              raise SystemExit("RECOVERY_ROUNDTRIP:DIGEST_FORMAT")
          if hashlib.sha256(packet.read_bytes()).hexdigest() != expected:
              raise SystemExit("RECOVERY_ROUNDTRIP:BYTES_MISMATCH")
          PYROUNDTRIP
          python -I tools/installed_recovery_evidence.py \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-tree "$(git rev-parse --verify 'HEAD^{tree}')" \
            verify "$RUNNER_TEMP/release-recovery-roundtrip/installed-wheel-recovery.json" \
            --subjects-directory "$RUNNER_TEMP/release-subject-roundtrip"
