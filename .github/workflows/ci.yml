name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cover both build's nested pip installs and pip's own isolated backends.
# Absolute paths survive the temporary build directories and sdist checks.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Repository hygiene guard
        run: python tools/check_repository_hygiene.py
      - name: Install package
        run: |
          set -euo pipefail
          python -m pip --version
          python -m pip install --help | grep -F -- '--build-constraint'
          python -m pip install -c constraints/ci.txt -e ".[test]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q megalodon tests
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke checks
        run: |
          set -euo pipefail
          python -m megalodon run --source sample --max-events 13
          python -m megalodon run --source sample --demo-threat --max-events 114
          python -m megalodon firewall-plan 8.8.8.8 --reason "CI smoke"

  wheel-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions and install wheel
        run: |
          set -euo pipefail
          python -m pip --version
          python -m pip install --help | grep -F -- '--build-constraint'
          python - <<'PYPROFILE'
          import platform
          import sys

          if (sys.implementation.name != "cpython" or sys.version_info[:2] != (3, 12)
                  or sys.platform != "linux" or platform.machine() != "x86_64"):
              raise SystemExit("BUILD_INPUT_PROFILE:UNSUPPORTED")
          PYPROFILE
          mkdir "$RUNNER_TEMP/test-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: --no-cache-dir \
            --dest "$RUNNER_TEMP/test-wheelhouse" -r constraints/test-linux-cp312.txt
          test_wheels=("$RUNNER_TEMP"/test-wheelhouse/*.whl)
          [ "${#test_wheels[@]}" -eq 11 ]
          sha256sum constraints/test-linux-cp312.txt "${test_wheels[@]}"
          python -m pip install -c constraints/ci.txt --no-index \
            --find-links "$RUNNER_TEMP/test-wheelhouse" --require-hashes \
            --only-binary=:all: --no-cache-dir --force-reinstall \
            -r constraints/test-linux-cp312.txt
          python -m pip check
          mkdir "$RUNNER_TEMP/build-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: --no-cache-dir \
            --dest "$RUNNER_TEMP/build-wheelhouse" -r constraints/build-linux-cp312.txt
          build_wheels=("$RUNNER_TEMP"/build-wheelhouse/*.whl)
          [ "${#build_wheels[@]}" -eq 4 ]
          sha256sum constraints/build-linux-cp312.txt "${build_wheels[@]}"
          python -m pip install --no-index --find-links "$RUNNER_TEMP/build-wheelhouse" \
            --require-hashes --only-binary=:all: --no-cache-dir --force-reinstall \
            -r constraints/build-linux-cp312.txt
          python -m pip check
          PIP_NO_INDEX=1 PIP_FIND_LINKS="$RUNNER_TEMP/build-wheelhouse" \
            PIP_ONLY_BINARY=:all: python -m build --sdist --wheel --outdir "$RUNNER_TEMP/distributions"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          wheels=("$RUNNER_TEMP"/distributions/megalodon_defense-*.whl)
          sdists=("$RUNNER_TEMP"/distributions/megalodon_defense-*.tar.gz)
          [ "${#wheels[@]}" -eq 1 ]
          [ "${#sdists[@]}" -eq 1 ]
          sha256sum "${wheels[0]}" "${sdists[0]}"
          mkdir "$RUNNER_TEMP/sdist-check"
          tar -xzf "${sdists[0]}" -C "$RUNNER_TEMP/sdist-check"
          sdist_roots=("$RUNNER_TEMP"/sdist-check/megalodon_defense-*)
          [ "${#sdist_roots[@]}" -eq 1 ]
          test -f "${sdist_roots[0]}/.gitignore"
          test -f "${sdist_roots[0]}/constraints/ci.txt"
          cmp constraints/build-linux-cp312.txt "${sdist_roots[0]}/constraints/build-linux-cp312.txt"
          cmp constraints/test-linux-cp312.txt "${sdist_roots[0]}/constraints/test-linux-cp312.txt"
          test -f "${sdist_roots[0]}/.github/workflows/ci.yml"
          test -f "${sdist_roots[0]}/config/settings.toml"
          test -f "${sdist_roots[0]}/contracts/automation/v1/schema.json"
          test -f "${sdist_roots[0]}/contracts/platform/windows-core-v1/acceptance.json"
          test -f "${sdist_roots[0]}/contracts/suricata-eve/v1/schema.json"
          test -f "${sdist_roots[0]}/docs/platform-baseline.md"
          test -f "${sdist_roots[0]}/docs/reference-data.md"
          test -f "${sdist_roots[0]}/examples/events.jsonl"
          test -f "${sdist_roots[0]}/tools/build_reference_assets.py"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps "${wheels[0]}"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip check
          python -m venv --system-site-packages "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --no-index --no-deps --no-build-isolation "${sdists[0]}"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip check
          (
            cd "${sdist_roots[0]}"
            git init -q
            "$RUNNER_TEMP/sdist-venv/bin/python" - <<'PY'
          from pathlib import Path
          import megalodon

          source = Path(megalodon.__file__).resolve()
          assert source.is_relative_to(Path.cwd().resolve()), source
          PY
            "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest
          )
      - name: Run installed default outside checkout
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/wheel-run"
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/megalodon" --help
          "$RUNNER_TEMP/wheel-venv/bin/megalodon-evaluate" --help
          "$RUNNER_TEMP/wheel-venv/bin/python" -m megalodon --help
          "$RUNNER_TEMP/wheel-venv/bin/python" -m megalodon.offline --help
          "$RUNNER_TEMP/wheel-venv/bin/python" -m megalodon run --source sample --max-events 1
          "$RUNNER_TEMP/wheel-venv/bin/megalodon-evaluate" reference verify
          "$RUNNER_TEMP/wheel-venv/bin/megalodon-evaluate" reference port tcp 443
          "$RUNNER_TEMP/wheel-venv/bin/megalodon-evaluate" corpus --scenario dns-protocol-gates-v1
          "$RUNNER_TEMP/sdist-venv/bin/megalodon-evaluate" reference verify
          "$RUNNER_TEMP/sdist-venv/bin/megalodon-evaluate" corpus --scenario dns-protocol-gates-v1
