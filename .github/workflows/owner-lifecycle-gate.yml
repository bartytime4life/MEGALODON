name: owner-lifecycle-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  # Only to post the verdict as a commit status on the exact PR head.
  statuses: write

concurrency:
  group: owner-lifecycle-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  exact-head-owner-authorization:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify latest owner lifecycle comment for the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          from datetime import datetime
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          api = os.environ["GH_API_URL"].rstrip("/")
          repository = os.environ["GH_REPOSITORY"]
          owner = os.environ["GH_REPOSITORY_OWNER"]
          event = json.loads(
              Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
          )

          if os.environ["GH_EVENT_NAME"] == "pull_request":
              pr_number = int(event["pull_request"]["number"])
          else:
              pr_number = int(event["issue"]["number"])

          # Comment-triggered runs execute on the default branch, so their own
          # check lands there; the commit status carries the verdict to the PR head.
          STATUS_CONTEXT = "owner-lifecycle-gate/exact-head"
          run_url = (
              f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{repository}"
              f"/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          )
          event_pull = event.get("pull_request") if os.environ["GH_EVENT_NAME"] == "pull_request" else None
          event_head = ((event_pull or {}).get("head") or {}).get("sha")
          if not isinstance(event_head, str) or not re.fullmatch(r"[0-9a-f]{40}", event_head):
              event_head = None
          # Fork pull_request runs get a read-only token; their comment-triggered runs post instead.
          head_repo = ((event_pull or {}).get("head") or {}).get("repo") or {}
          read_only_token = event_pull is not None and head_repo.get("full_name") != repository

          class IncompleteState(Exception):
              pass

          # One shared budget covers both scans and all pull-state reads.
          MAX_COMMENTS = 1000
          MAX_RESPONSE_BYTES = 8 * 1024 * 1024
          MAX_TOTAL_BYTES = 128 * 1024 * 1024
          deadline = time.monotonic() + 180
          remaining_bytes = MAX_TOTAL_BYTES

          def time_left():
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise IncompleteState("GitHub read deadline exhausted")
              return remaining

          def get_json(path: str):
              global remaining_bytes
              request = urllib.request.Request(
                  f"{api}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "megalodon-owner-lifecycle-gate",
                  },
              )
              chunks = []
              size = 0
              with urllib.request.urlopen(request, timeout=min(20, time_left())) as response:
                  while True:
                      time_left()
                      chunk = response.read(65536)
                      time_left()
                      if not chunk:
                          break
                      size += len(chunk)
                      remaining_bytes -= len(chunk)
                      if size > MAX_RESPONSE_BYTES or remaining_bytes < 0:
                          raise IncompleteState("GitHub response byte bound exceeded")
                      chunks.append(chunk)
              return json.loads(b"".join(chunks))

          def pull_state():
              pull = get_json(f"/repos/{repository}/pulls/{pr_number}")
              if not isinstance(pull, dict) or not isinstance(pull.get("head"), dict):
                  raise IncompleteState("malformed pull state")
              sha = pull["head"].get("sha")
              draft = pull.get("draft")
              count = pull.get("comments")
              if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise IncompleteState("non-canonical head SHA")
              if type(draft) is not bool or type(count) is not int or count < 0:
                  raise IncompleteState("malformed pull state")
              if count > MAX_COMMENTS:
                  raise IncompleteState("comment history exceeds 1000-comment bound")
              return sha, draft, count

          def scan_comments(count):
              comments = []
              previous_id = 0
              # A full last page cannot prove exhaustion: read an empty sentinel
              # page even at the 1000-comment ceiling (at most eleven requests).
              for offset in range(0, count + (1 if count % 100 == 0 else 0), 100):
                  # Construct only fixed numbered API paths; never follow supplied URLs.
                  page = get_json(
                      f"/repos/{repository}/issues/{pr_number}/comments"
                      f"?per_page=100&page={offset // 100 + 1}"
                  )
                  if not isinstance(page, list) or len(page) != min(100, count - offset):
                      raise IncompleteState("incomplete comment page")
                  for comment in page:
                      if not isinstance(comment, dict):
                          raise IncompleteState("malformed comment")
                      identity = comment.get("id")
                      user = comment.get("user")
                      created = comment.get("created_at")
                      association = comment.get("author_association")
                      body = comment.get("body")
                      # GitHub always reports this key; null means not posted through an app.
                      app = comment.get("performed_via_github_app", False)
                      if (
                          type(identity) is not int or identity <= previous_id
                          or not isinstance(user, dict)
                          or not isinstance(user.get("login"), str)
                          or not isinstance(association, str)
                          or not isinstance(created, str)
                          or not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", created)
                          or (body is not None and not isinstance(body, str))
                          or not (app is None or isinstance(app, dict))
                      ):
                          raise IncompleteState("malformed or unordered comment")
                      datetime.strptime(created, "%Y-%m-%dT%H:%M:%SZ")
                      previous_id = identity
                      # Compare every input consumed by the authorization decision.
                      comments.append({
                          "id": identity, "user": {"login": user["login"]},
                          "author_association": association, "created_at": created,
                          "body": body or "", "via_app": app is not None,
                      })
              return comments

          def finish(code: int, sha: str | None, description: str):
              # Only an exact-head authorization (code 0) ever posts success.
              state = "success" if code == 0 else "failure"
              if sha is None:
                  print(f"No verified PR head; {STATUS_CONTEXT} status not posted.")
              elif read_only_token:
                  print(f"Fork pull request token is read-only; {STATUS_CONTEXT} status not posted.")
              else:
                  request = urllib.request.Request(
                      f"{api}/repos/{repository}/statuses/{sha}",
                      data=json.dumps({
                          "state": state, "context": STATUS_CONTEXT,
                          "description": description[:140], "target_url": run_url,
                      }).encode(),
                      method="POST",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "megalodon-owner-lifecycle-gate",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          response.read(65536)
                  except OSError as exc:
                      print(f"Unable to post {STATUS_CONTEXT} status on {sha}: {exc}")
                      raise SystemExit(code or 1)
                  print(f"Posted {STATUS_CONTEXT}={state} on {sha}")
              raise SystemExit(code)

          head = None
          try:
              initial = pull_state()
              head, draft, count = initial
              if draft:
                  raise IncompleteState("pull request is draft")
              comments = scan_comments(count)
              if pull_state() != initial:
                  raise IncompleteState("pull state changed during comment retrieval")
              confirmed = scan_comments(count)
              if confirmed != comments or pull_state() != initial:
                  raise IncompleteState("GitHub state changed during confirmation")
              time_left()
          except (IncompleteState, OSError, ValueError, urllib.error.URLError) as exc:
              print(f"OWNER_LIFECYCLE_HOLD: unable to confirm complete GitHub state: {exc}")
              finish(3, head or event_head, f"Hold: unable to confirm complete GitHub state: {exc}")

          header = "MEGALODON-OWNER-AUTHORIZATION-V1"
          records = []
          for comment in comments:
              if comment.get("user", {}).get("login") != owner:
                  continue
              if comment.get("author_association") != "OWNER":
                  continue
              body = comment.get("body") or ""
              if header not in body:
                  continue
              fields = {}
              for raw_line in body.splitlines():
                  line = raw_line.strip()
                  if ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  fields[key.strip().lower()] = value.strip()
              if fields.get("head") != head:
                  continue
              if fields.get("scope") != "ready-and-merge":
                  continue
              state = fields.get("state")
              if state not in {"authorized", "revoked"}:
                  continue
              # An app acting with the owner's token may revoke, never authorize.
              if comment["via_app"] and state != "revoked":
                  continue
              records.append((comment["created_at"], int(comment["id"]), state))

          if not records:
              print(
                  "OWNER_LIFECYCLE_HOLD: no owner authorization matches "
                  f"PR #{pr_number} exact head {head}"
              )
              print("Expected owner comment:")
              print(header)
              print(f"head: {head}")
              print("scope: ready-and-merge")
              print("state: authorized")
              finish(3, head, "Hold: no owner authorization for this exact head")

          _, comment_id, state = sorted(records)[-1]
          if state != "authorized":
              print(
                  "OWNER_LIFECYCLE_HOLD: latest exact-head owner record "
                  f"#{comment_id} is revoked"
              )
              finish(3, head, f"Hold: latest owner record #{comment_id} is revoked")

          print(
              "OWNER_LIFECYCLE_AUTHORIZED: "
              f"PR #{pr_number} head {head} by owner record #{comment_id}"
          )
          print(
              "Boundary: authorization covers ready transition and merge only; "
              "it does not authorize release, deployment, installation, model or "
              "sensor operation, firewall changes, or independent acceptance."
          )
          finish(0, head, f"Authorized by owner record #{comment_id} for ready and merge only")
          PY
