name: Host protection packet acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-host-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install namespace test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nftables iproute2
      - name: Exercise only a fresh user and network namespace
        run: |
          set -euo pipefail
          mkdir -p artifacts/host-protection-native
          parent_net="$(readlink /proc/self/ns/net)"
          # Mapped root cannot traverse the runner's owner-private home. Stage
          # only the two stdlib-only test inputs in a private, root-owned copy.
          fixture_root="$(mktemp -d /tmp/megalodon-host-native.XXXXXX)"
          trap 'sudo rm -rf -- "$fixture_root"' EXIT
          mkdir -p "$fixture_root/tests" "$fixture_root/megalodon"
          cp tests/host_protection_native.py "$fixture_root/tests/"
          cp megalodon/host_guard.py "$fixture_root/megalodon/"
          touch "$fixture_root/megalodon/__init__.py"
          cmp tests/host_protection_native.py "$fixture_root/tests/host_protection_native.py"
          cmp megalodon/host_guard.py "$fixture_root/megalodon/host_guard.py"
          sha256sum "$fixture_root/tests/host_protection_native.py" "$fixture_root/megalodon/host_guard.py"
          sudo chown -R root:root "$fixture_root"
          # sudo is needed on runners restricting unprivileged user namespaces.
          # The harness refuses the parent network namespace and a nonempty ruleset.
          sudo env MEGALODON_TEST_PARENT_NET="$parent_net" \
            unshare --user --map-root-user --net \
            /usr/bin/python3 "$fixture_root/tests/host_protection_native.py" \
            | tee artifacts/host-protection-native/result.json
      - name: Retain isolated packet acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-protection-native-${{ github.sha }}
          path: artifacts/host-protection-native/
          if-no-files-found: warn
          retention-days: 7
