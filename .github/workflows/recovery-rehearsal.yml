name: Ubuntu synthetic recovery rehearsal

on:
  pull_request:

permissions:
  contents: read

jobs:
  recovery-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rehearse synthetic backup and restore without activation
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          export EXPECTED_TREE="$(git rev-parse --verify 'HEAD^{tree}')"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python tests/recovery_rehearsal.py
