name: Linux browser acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install nested Wayland compositor
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y weston
      - name: Check prepared browser prerequisites
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -x /opt/google/chrome/chrome
          test -x /usr/bin/xvfb-run
          test -x /usr/bin/weston
          weston --version
          /opt/google/chrome/chrome --version
      - name: Install test environment only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          python -m pip install -c constraints/ci.txt -e ".[test]" "playwright==1.57.0"
          python -m pip check
          python -m compileall -q megalodon tests
      - name: Exercise real CLI SQLite HTTP and browser
        run: |
          set -euo pipefail
          xvfb-run -a bash -c 'set -euo pipefail
            runtime=/tmp/megalodon-wayland-runtime
            install -d -m 700 "$runtime"
            export XDG_RUNTIME_DIR="$runtime"
            export WAYLAND_DISPLAY=wayland-1
            weston --backend=x11-backend.so --renderer=pixman --socket="$WAYLAND_DISPLAY" --idle-time=0 \
              --width=1600 --height=1200 >/tmp/megalodon-weston.log 2>&1 &
            compositor_pid=$!
            trap "kill $compositor_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 50); do
              if ! kill -0 "$compositor_pid" 2>/dev/null; then
                cat /tmp/megalodon-weston.log
                exit 1
              fi
              if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
                break
              fi
              if [ "$attempt" -eq 50 ]; then
                cat /tmp/megalodon-weston.log
                exit 1
              fi
              sleep 0.1
            done
            MEGALODON_BROWSER_PLATFORM=wayland python tests/browser_acceptance.py'
