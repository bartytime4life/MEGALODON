name: Linux browser acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cover both build's nested pip installs and pip's own isolated backends.
# Absolute paths survive the temporary build directories and sdist checks.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install native display manager
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox x11-utils
      - name: Check prepared browser prerequisites
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -x /opt/google/chrome/chrome
          test -x /usr/bin/xvfb-run
          test -x /usr/bin/openbox
          test -x /usr/bin/xprop
          openbox --version
          /opt/google/chrome/chrome --version
      - name: Install test environment only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          python -m pip --version
          python -m pip install --help | grep -F -- '--build-constraint'
          python - <<'PYBROWSERPROFILE'
          import platform
          import sys

          if (sys.implementation.name != "cpython" or sys.version_info[:2] != (3, 11)
                  or sys.platform != "linux" or platform.machine() != "x86_64"
                  or platform.libc_ver()[0] != "glibc"):
              raise SystemExit("BROWSER_INPUT_PROFILE:UNSUPPORTED")
          PYBROWSERPROFILE
          mkdir "$RUNNER_TEMP/browser-cp311-wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: --no-cache-dir \
            --dest "$RUNNER_TEMP/browser-cp311-wheelhouse" -r constraints/browser-linux-cp311.txt
          browser_wheels=("$RUNNER_TEMP"/browser-cp311-wheelhouse/*.whl)
          [ "${#browser_wheels[@]}" -eq 15 ]
          sha256sum constraints/browser-linux-cp311.txt constraints/test-linux-cp311.txt "${browser_wheels[@]}"
          python -m pip install -c constraints/ci.txt --no-index \
            --find-links "$RUNNER_TEMP/browser-cp311-wheelhouse" --require-hashes \
            --only-binary=:all: --no-cache-dir --force-reinstall \
            -r constraints/browser-linux-cp311.txt
          python -m pip check
          PIP_NO_INDEX=1 PIP_FIND_LINKS="$RUNNER_TEMP/browser-cp311-wheelhouse" \
            PIP_ONLY_BINARY=:all: python -m pip install -c constraints/ci.txt \
            --no-cache-dir --verbose -e ".[test]"
          python -m pip check
          python -m compileall -q megalodon tests
      - name: Exercise real CLI SQLite HTTP and browser
        run: |
          set -euo pipefail
          xvfb-run -a bash -c 'set -euo pipefail
            openbox --sm-disable --replace >/tmp/megalodon-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 50); do
              if ! kill -0 "$wm_pid" 2>/dev/null; then
                cat /tmp/megalodon-openbox.log
                exit 1
              fi
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "_NET_SUPPORTING_WM_CHECK(WINDOW)"; then
                break
              fi
              if [ "$attempt" -eq 50 ]; then
                cat /tmp/megalodon-openbox.log
                exit 1
              fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK
            python tests/browser_native_profile.py'
