name: Linux browser acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install native display manager
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openbox
      - name: Check prepared browser prerequisites
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test -x /opt/google/chrome/chrome
          test -x /usr/bin/xvfb-run
          test -x /usr/bin/openbox
          /opt/google/chrome/chrome --version
      - name: Install test environment only
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          python -m pip install -c constraints/ci.txt -e ".[test]" "playwright==1.57.0"
          python -m pip check
          python -m compileall -q megalodon tests
      - name: Exercise real CLI SQLite HTTP and browser
        run: |
          set -euo pipefail
          xvfb-run -a bash -c 'set -euo pipefail
            openbox --sm-disable >/tmp/megalodon-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 50); do
              if kill -0 "$wm_pid" 2>/dev/null; then
                break
              fi
              if [ "$attempt" -eq 50 ]; then
                cat /tmp/megalodon-openbox.log
                exit 1
              fi
              sleep 0.1
            done
            python tests/browser_acceptance.py'
